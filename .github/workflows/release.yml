# Releases each push to main that changes what users run: CI, then the wrapper's live checks on real
# Claude, then the built dist/ committed on top as the release commit, which is not on main, tagged
# vX.Y.Z, and the major tag moved to it. A patch, or a minor or a major when a PR merged since the last
# release has the `minor` or `major` label; a major releases even when nothing users run changed. A failed
# run releases nothing, and the next push's run releases what it held back.
name: Release

on:
  push:
    branches: [main]
  # The push's run starts this one on main. By hand, it retries a failed run on main; from another branch
  # it runs every check and releases nothing.
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so each run sees the tags of the one before it
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # claude-code-action, which the wrapper's checks run, refuses a push event
  dispatch:
    name: Start as a dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main

  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  changes:
    name: What users run
    needs: ci
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      last: ${{ steps.version.outputs.last }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, and the commits since the last one
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci && npm run build
      - name: Next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          bump="patch"
          for sha in $(git rev-list "$last..HEAD"); do
            labels=$(gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '.[].labels[].name')
            if grep -qx major <<<"$labels"; then
              bump="major"
            elif grep -qx minor <<<"$labels" && [[ $bump == patch ]]; then
              bump="minor"
            fi
          done
          # Staged, so the diff sees the ignored dist/
          git add --force dist
          if [[ $bump != major ]] && git diff --cached --quiet "$last" -- dist action.yml wrapper bin; then
            echo "::notice::Nothing users run changed since $last, so nothing is released."
            exit 0
          fi
          IFS=. read -r major middle patch <<<"${last#v}"
          case $bump in
            major) tag="v$((major + 1)).0.0" ;;
            minor) tag="v$major.$((middle + 1)).0" ;;
            patch) tag="v$major.$middle.$((patch + 1))" ;;
          esac
          echo "::notice::$last is followed by $tag."
          printf 'tag=%s\nlast=%s\n' "$tag" "$last" >>"$GITHUB_OUTPUT"

  wrapper:
    needs: changes
    if: needs.changes.outputs.tag != ''
    uses: ./.github/workflows/wrapper.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  release:
    needs: [changes, wrapper]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps the token, for the tag pushes below
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-code-version
          path: ${{ runner.temp }}
      - name: Release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.changes.outputs.tag }}
          LAST: ${{ needs.changes.outputs.last }}
        run: |
          set -euo pipefail
          # Before the tag exists: a tag without its release would read as released to the next run.
          claude_code=$(<"$RUNNER_TEMP/claude-code-version")
          action=$(grep -oE 'claude-code-action@[0-9a-f]+ # v[0-9.]+' .github/workflows/wrapper.yml | sed 's/.*# //')
          sdk=$(jq -r '.devDependencies["@anthropic-ai/claude-agent-sdk"]' package.json)
          notes="Tested with Claude Code $claude_code through claude-code-action $action, and the message types of Agent SDK $sdk."
          git add --force dist
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "$TAG"
          git push origin "HEAD:refs/tags/$TAG"
          # Named: the release commits are off main, so GitHub's own guess of the one before is wrong
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-start-tag "$LAST" --notes "$notes"
          # Last, so the major tag moves only to a published release. Through the API, the way past releases
          # moved it: a git push of a move that spans workflow changes may be refused to GITHUB_TOKEN.
          major=${TAG%%.*}
          sha=$(git rev-parse HEAD)
          if gh api "repos/$GH_REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
