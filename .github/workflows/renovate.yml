# Self-hosted Renovate (.github/renovate.json5), as the org's App swissconn-ops. Its key is in the ops
# environment, which only main can use, so only main's copy of this file reaches it.
name: Renovate

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # The `rebase` label on its PR, which Renovate takes off once it has rebuilt the branch. Runs main's copy
  # of this file, never the PR's code
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

# Renovate pushes a branch and then opens its PR: cancelling between the two strands the branch
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.label.name == 'rebase' && startsWith(github.event.pull_request.head.ref, 'renovate/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    environment:
      name: ops
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without statuses Renovate pushes the branch, then cannot set its release-age status or open the PR
      - name: Get the App's token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SWISSCONN_OPS_CLIENT_ID }}
          private-key: ${{ secrets.SWISSCONN_OPS_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          configurationFile: .github/renovate.json5
          token: ${{ steps.app.outputs.token }}
          additional-env-list: |
            LOG_FILE
            LOG_FILE_LEVEL
        env:
          LOG_LEVEL: info
          # In the /tmp the Action mounts, for the next step
          LOG_FILE: /tmp/renovate.ndjson
          LOG_FILE_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted only: Renovate rejects them in a repository's config file
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"

      # Renovate exits 0 when it gives up on the repository (swissconn-workspace #1315)
      - name: Fail unless Renovate finished the repository
        run: |
          result=$(jq -r 'select(.msg == "Repository finished") | .result' /tmp/renovate.ndjson)
          if [[ "$result" != "done" ]]; then
            echo "::error::Renovate did not finish the repository: ${result:-no result}"
            exit 1
          fi
