# Self-hosted Renovate; renovate.json is the repository config. The Renovate app is not installed on
# the org, and swissconn-workspace's own Renovate job covers only that repository.
# Requires the repository secret RENOVATE_TOKEN: a fine-grained PAT for this repository with
# contents, issues, pull requests and workflows write, and metadata and commit statuses read.
name: Renovate

on:
  schedule:
    # Monday 05:00 UTC. renovate.json leaves the whole of Monday open so a late cron start still
    # lands inside the schedule window.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  # Renovate pushes a branch and then opens its PR. Cancelling between the two strands the branch.
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted-only options, which Renovate rejects inside renovate.json.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          # Distinct from the PAT owner, so Renovate can tell its own commits from a human edit to
          # one of its branches. .invalid is reserved (RFC 2606) and never routes mail.
          RENOVATE_GIT_AUTHOR: "Renovate Bot <bot@swissconnection.invalid>"
