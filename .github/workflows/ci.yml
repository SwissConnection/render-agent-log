name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format check
        run: npx biome ci
      - name: Test
        run: npm test
      - name: dist/ matches the source
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            git diff -- dist
            echo "::error::dist/ is stale. Run npm run build and commit dist/."
            exit 1
          fi
