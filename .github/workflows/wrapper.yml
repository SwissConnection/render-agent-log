# Live checks of the wrapper (#2, #6): rendered output from inside claude-code-action, through the
# wrapper this Action ships, on real Claude. release.yml runs them before every release, and they are
# worth a dispatch after bumping the action: the wrapper leans on the action's internals (see #2). Each
# job also renders the run after the fact, and its raw stream through the CLI, so all three modes run
# against a real run. Runs Claude, so only from a push or a dispatch (AGENTS.md rule 5).
name: Wrapper

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # One turn ends the run in error_max_turns, so the action reports a failure (::error::), which is
        # the case's expected outcome. In the cancelled case, the step times out in a wait, and the
        # action stops the session (#84).
        include:
          - { name: healthy, renderer: healthy, max_turns: 4, outcome: success }
          - { name: renderer dies, renderer: dies, max_turns: 4, outcome: success }
          - { name: renderer hangs, renderer: hangs, max_turns: 4, outcome: success }
          - { name: run fails, renderer: healthy, max_turns: 1, outcome: failure }
          - { name: renderer dies and run fails, renderer: dies, max_turns: 1, outcome: failure }
          - { name: run cancelled, renderer: records, max_turns: 4, outcome: failure, cancel: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci && npm run build

      - name: Set up the live modes
        id: render
        uses: ./
        with:
          stream-copy: ${{ runner.temp }}/claude-stream.jsonl

      # The node that runs the renderer is the seam: in the claude step, the renderer dies right after
      # it opens its first group, never reads at all, or renders and saves how it exited, outliving
      # the action's SIGTERM to do so. A later write to GITHUB_ENV wins.
      - name: Stand in for the renderer's node
        run: |
          fake="$RUNNER_TEMP/fake-node"
          cat >"$fake" <<EOF
          #!/bin/sh
          case "\$SPIKE_RENDERER" in
            dies) "$RENDER_AGENT_LOG_NODE" "\$@" | awk '{ print } /^::group::/ { exit 1 }' ;;
            hangs) exec sleep 3600 ;;
            records)
              trap '' TERM
              "$RENDER_AGENT_LOG_NODE" "\$@"
              echo \$? >"$RUNNER_TEMP/renderer-exit"
              ;;
            *) exec "$RENDER_AGENT_LOG_NODE" "\$@" ;;
          esac
          EOF
          chmod +x "$fake"
          echo "RENDER_AGENT_LOG_NODE=$fake" >>"$GITHUB_ENV"

      - name: Write tool output with workflow commands in it
        run: |
          cat >"$RUNNER_TEMP/hostile-output.txt" <<'EOF'
          ::error::injected by tool output: must not become an annotation
            ::warning::injected behind leading spaces: must not become an annotation
          ::add-mask::spike-wrapper-secret
          ::endgroup::
          still inside the group: the injected endgroup above did nothing
          ::group::injected group
          end of the tool output
          EOF

      - name: Claude through the wrapper
        id: claude
        continue-on-error: ${{ matrix.outcome == 'failure' }}
        timeout-minutes: ${{ matrix.cancel && 1 || 10 }}
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        env:
          SPIKE_RENDERER: ${{ matrix.renderer }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The release and the dependency checks start as dispatches by github-actions
          allowed_bots: github-actions
          path_to_claude_code_executable: ${{ steps.render.outputs.wrapper }}
          # Bash, not Read: Read numbers its lines, so injected commands would not start a line.
          # Not a sleep in the cancelled case: Claude Code blocks a standalone sleep.
          prompt: |
            In a single message, make these two tool calls in parallel:
            Bash `cat ${{ runner.temp }}/hostile-output.txt` and Read `README.md`.
            ${{ matrix.cancel && 'Then run Bash `timeout 300 tail -f /dev/null`.' || '' }}
            Then reply with one short sentence. Do nothing else.
          claude_args: |
            --model haiku
            --allowedTools "Bash,Read"
            --max-turns ${{ matrix.max_turns }}

      - name: After the action
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RENDERER: ${{ matrix.renderer }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXPECTED: ${{ matrix.outcome }}
        run: |
          if [ "$OUTCOME" != "$EXPECTED" ]; then
            echo "::error::the action's step ended in $OUTCOME, where this case expects $EXPECTED"
            exit 1
          fi
          echo "::add-mask::control-after-action"
          echo "control: control-after-action (prints *** when commands are live in this step)"
          echo "injected: spike-wrapper-secret (prints in clear when the injected add-mask stayed inert)"
          echo "action outputs: conclusion=${CONCLUSION:-unset} execution_file=${EXECUTION_FILE:-unset}"
          if [ "$RENDERER" = hangs ]; then
            echo "a hung renderer never gets to write the raw copy"
            exit 0
          fi
          if [ "$RENDERER" = records ]; then
            # The action sends SIGTERM and kills what is left a second later: 143 is the renderer's
            # own stop, after it closed its groups. A kill or no signal at all leaves no status.
            status=$(cat "$RUNNER_TEMP/renderer-exit" 2>/dev/null || echo none)
            copy=missing
            if [ -s "$RUNNER_TEMP/claude-stream.jsonl" ]; then copy=written; fi
            echo "renderer exit status: $status; stream copy: $copy"
            if [ "$status" != 143 ]; then
              echo "::error::the renderer's exit status is $status, where a stop on the action's SIGTERM gives 143"
              exit 1
            fi
            exit 0
          fi
          # The wrapper removes its buffer once the copy is written.
          for _ in $(seq 50); do
            ls "$RUNNER_TEMP"/render-agent-log.* >/dev/null 2>&1 || break
            sleep 0.2
          done
          # Every message the SDK recorded, byte for byte after normalizing, is in the wrapper's copy.
          stream="$RUNNER_TEMP/claude-stream.jsonl"
          if [ ! -s "$stream" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::error::the wrapper's copy or the execution file is missing or empty"
            exit 1
          fi
          echo "wrapper copy: $(wc -l <"$stream") lines; execution file: $(jq length "$EXECUTION_FILE") messages"
          missing=$(comm -23 <(jq -cS '.[]' "$EXECUTION_FILE" | sort) <(jq -cS . "$stream" | sort))
          if [ -n "$missing" ]; then
            echo "SDK messages the wrapper's copy lacks:"
            echo "$missing" | cut -c1-200
            exit 1
          fi
          echo "every SDK message is in the wrapper's copy"

      # For the release's "Tested with" line
      - name: The Claude Code it ran
        if: matrix.name == 'healthy'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r 'first(.[] | select(.type == "system" and .subtype == "init")) | .claude_code_version' \
            "$EXECUTION_FILE" >"$RUNNER_TEMP/claude-code-version"
      - if: matrix.name == 'healthy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-code-version
          path: ${{ runner.temp }}/claude-code-version

      - name: The same run, after the fact
        if: always() && steps.claude.outputs.execution_file != ''
        uses: ./
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}

      - name: The same run, through the CLI
        if: always() && matrix.renderer != 'hangs' && !matrix.cancel
        run: render-agent-log < "$RUNNER_TEMP/claude-stream.jsonl"
