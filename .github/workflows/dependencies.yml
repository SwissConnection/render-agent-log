# The checks on Renovate's PR (#22): what changed in the Agent SDK's types, a real run of the Claude
# Code that the branch's SDK ships through the branch's renderer, and the wrapper's live checks. They
# go into the run's summary, and into the PR's description below Renovate's part, where Renovate's own
# updates leave them.
name: Dependencies

on:
  push:
    branches: ["renovate/**"]
  # The push's run starts this one on its branch. By hand, on a branch with no PR, it writes only the
  # run's summary.
  workflow_dispatch:

permissions:
  contents: read

# A newer head replaces the checks of the older one
concurrency:
  group: dependencies-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # claude-code-action, which the wrapper's checks run, refuses a push event
  dispatch:
    name: Start as a dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run dependencies.yml --ref "$GITHUB_REF_NAME"

  types:
    name: The SDK's types
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Against main's
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          sdk='.devDependencies["@anthropic-ai/claude-agent-sdk"]'
          old=$(git show FETCH_HEAD:package.json | jq -r "$sdk")
          new=$(jq -r "$sdk" package.json)
          bash .github/scripts/type-diff.sh "$old" "$new" "$RUNNER_TEMP/types"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: types
          path: ${{ runner.temp }}/types/

  canary:
    name: A real run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci && npm run build

      # The claude that the SDK installs with it, so its version is the one whose types the branch has.
      # Its rendering here is the sample a reviewer reads.
      - name: Claude Code, rendered
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: |
            Work in the current directory, which is empty. Keep a short to-do list of these steps as you go.
            Write notes.txt with three short lines, read it back, then edit its second line.
            Find the file with a glob, search it for "line", and run `wc -l notes.txt`.
            Then have a subagent read notes.txt and report its first line.
            End with one sentence on what you did.
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/canary
          mkdir -p "$out/work"
          cd "$out/work"
          "$GITHUB_WORKSPACE/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" -p "$PROMPT" \
            --model haiku --max-turns 30 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent,Task,TodoWrite" \
            --output-format stream-json --verbose |
            tee "$out/stream.jsonl" | node "$GITHUB_WORKSPACE/dist/index.js" | tee "$out/rendered.log"

      - name: What the renderer does not know
        if: ${{ !cancelled() }}
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/canary
          version=$(jq -r 'select(.type == "system" and .subtype == "init") | .claude_code_version' \
            "$out/stream.jsonl" 2>/dev/null | head -n 1)
          messages=$(grep -c . "$out/stream.jsonl" || true)
          unknown=$(sed 's/\x1b\[[0-9;]*m//g' "$out/rendered.log" 2>/dev/null |
            grep -oE '· [^ ]+ \(unknown (message type|subtype)\)|· unrenderable [^ ]+ message \([^)]*\)' |
            sed -E 's/^· //; s/ \(unknown (message type|subtype)\)$//' | sort | uniq -c | awk '{ n = $1; $1 = ""; printf "%s`%s` ×%d", (NR > 1 ? ", " : ""), substr($0, 2), n }' || true)
          if [[ -z $version ]]; then
            line="❌ **A real run** did not start · [run]($RUN)"
          elif [[ -n $unknown ]]; then
            line="❌ **A real run** of Claude Code $version: $messages messages, some the renderer cannot show: $unknown · [run]($RUN)"
          else
            line="✅ **A real run** of Claude Code $version: $messages messages, all rendered · [run]($RUN)"
          fi
          echo "$line" | tee "$out/line.md"
          [[ $line == ✅* ]]

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary
          path: |
            ${{ runner.temp }}/canary/line.md
            ${{ runner.temp }}/canary/stream.jsonl

  wrapper:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wrapper.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  card:
    name: Into the description
    needs: [types, canary, wrapper]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/checks
      - name: Write it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WRAPPER: ${{ needs.wrapper.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          checks=$RUNNER_TEMP/checks
          action=$(grep -oE 'claude-code-action@[0-9a-f]+ # v[0-9.]+' .github/workflows/wrapper.yml | sed 's/.*# //')
          if [[ $WRAPPER == success ]]; then
            wrapper="✅ **The wrapper** in claude-code-action $action: every case as expected · [run]($RUN)"
          else
            wrapper="❌ **The wrapper** in claude-code-action $action: $WRAPPER · [run]($RUN)"
          fi
          # Renovate's fingerprint of the description stops at this line
          marker='<!-- Reviewable:start -->'
          {
            echo "$marker"
            echo
            echo "### Checks"
            echo
            cat "$checks/canary/line.md" 2>/dev/null || echo "❌ **A real run**: no result · [run]($RUN)"
            echo
            echo "$wrapper"
            echo
            cat "$checks/types/summary.md" 2>/dev/null || echo "❌ **The SDK's types**: no result · [run]($RUN)"
          } >"$RUNNER_TEMP/card.md"
          cat "$RUNNER_TEMP/card.md" >>"$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [[ -n $pr ]] || exit 0
          gh pr view "$pr" --json body --jq .body >"$RUNNER_TEMP/body.md"
          { awk -v marker="$marker" '$0 == marker { exit } { print }' "$RUNNER_TEMP/body.md"; cat "$RUNNER_TEMP/card.md"; } |
            gh pr edit "$pr" --body-file -
