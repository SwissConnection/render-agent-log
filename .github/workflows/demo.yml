# A real-world run to show what the log looks like: Claude fixes a failing test in demo/, rendered
# live inside claude-code-action. The README's screenshots come from here, and its execution_file is
# the fixture fixtures/claude/execution-file.json. The bug in demo/src/cart.js is the point of the
# run, so no commit fixes it; CI does not run demo/'s tests. AGENTS.md says nothing more about it,
# because the demo's agent reads AGENTS.md too and would stop to ask.
# Runs Claude, so workflow_dispatch only (AGENTS.md rule 5).
name: Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-26.04 # ubuntu-latest adds a label-migration notice to every run summary
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Action's runtime (runs.using: node24), not the newest Node
          cache: npm
      - run: npm ci && npm run build

      - name: Set up render-agent-log
        id: render
        uses: ./

      - name: Fix the failing test
        id: claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          path_to_claude_code_executable: ${{ steps.render.outputs.wrapper }}
          prompt: |
            The test suite of the small shop in demo/ fails (run it with `npm test --silent` in demo/).
            Read files with the Read tool rather than cat. Find the cause, fix it in the source
            rather than the tests, and run the suite again.
            Then say in two sentences what was wrong.
          claude_args: |
            --model sonnet
            --allowedTools "Bash,Read,Edit,Grep,Glob"
            --max-turns 15

      - name: Keep the execution file
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-file
          path: ${{ steps.claude.outputs.execution_file }}
